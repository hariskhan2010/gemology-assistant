<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32">
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); transform-origin: 16px 16px; }
      to { transform: rotate(360deg); transform-origin: 16px 16px; }
    }
    .gem { animation: spin 3s linear infinite; }
  </style>
  <image class="gem" href="data:image/webp;base64," width="32" height="32"/>
</svg>
